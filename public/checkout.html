<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - OmniCommerce</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Omni<span>Commerce</span></a>
      <ul class="nav-links">
        <li><a href="/index.html">Shop</a></li>
        <li><a href="/cart.html">Cart <span id="cart-badge-count" class="cart-badge">0</span></a></li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 2rem; margin-bottom: 3rem;">
    <h1>Checkout Wizard</h1>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-top: 1.5rem;">
      <form id="checkout-form" onsubmit="submitOrder(event)" style="background: #fff; padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border-color);">
        <h3 style="margin-bottom: 1rem;">1. Shipping Information</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="font-weight: 600;">Full Name</label>
            <input type="text" name="name" class="form-control" required placeholder="John Doe">
          </div>
          <div>
            <label style="font-weight: 600;">Email Address</label>
            <input type="email" name="email" class="form-control" required placeholder="john@example.com">
          </div>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="font-weight: 600;">Street Address</label>
          <input type="text" name="street" class="form-control" required placeholder="123 Tech Way">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
          <div>
            <label style="font-weight: 600;">City</label>
            <input type="text" name="city" class="form-control" required placeholder="San Francisco">
          </div>
          <div>
            <label style="font-weight: 600;">State / Code</label>
            <input type="text" name="state" class="form-control" required placeholder="CA">
          </div>
          <div>
            <label style="font-weight: 600;">ZIP Code</label>
            <input type="text" name="zip" class="form-control" required placeholder="94105">
          </div>
        </div>

        <h3 style="margin-bottom: 1rem;">2. Payment Gateway Method</h3>
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="radio" name="paymentMethod" value="STRIPE_CREDIT_CARD" checked> Stripe Credit / Debit Card (Mock)
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="radio" name="paymentMethod" value="PAYPAL"> PayPal Checkout (Mock)
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY"> Cash on Delivery
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 0.8rem;">Place Order Now</button>
      </form>

      <div id="checkout-summary" style="background: #fff; padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border-color); height: fit-content;">
        <!-- Dynamic order summary populated by checkout.js -->
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 OmniCommerce Enterprise Platform.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await AuthManager.init();
      await initCheckoutPage();
    });
  </script>
</body>
</html>
