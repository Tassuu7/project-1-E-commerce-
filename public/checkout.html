<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Wizard - OmniCommerce Enterprise</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Omni<span>Commerce</span> <span class="logo-badge">Enterprise</span></a>
      <ul class="nav-links">
        <li><a href="/index.html">Shop Catalog</a></li>
        <li><a href="/cart.html" class="cart-link">🛒 Cart <span id="cart-badge-count" class="cart-badge" style="display: none;">0</span></a></li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 2.5rem; margin-bottom: 4rem;">
    <!-- Step Header -->
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">Secure Enterprise Checkout</h1>
      <p style="color: var(--text-muted); font-size: 1rem;">Complete your order with multi-gateway payment protection</p>
    </div>

    <div style="display: grid; grid-template-columns: 1.65fr 1fr; gap: 2.5rem; align-items: start;">
      <!-- Checkout Form Card -->
      <form id="checkout-form" onsubmit="submitOrder(event)" style="background: var(--bg-surface); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
        <!-- Step 1: Customer Info -->
        <div style="margin-bottom: 2rem; padding-bottom: 1.75rem; border-bottom: 1px solid var(--border-light);">
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
            <span style="background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">1</span>
            <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">Customer Information</h3>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" id="cust-name" class="form-control" placeholder="Jane Customer" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" id="cust-email" class="form-control" placeholder="jane@example.com" required>
            </div>
          </div>
        </div>

        <!-- Step 2: Shipping Address -->
        <div style="margin-bottom: 2rem; padding-bottom: 1.75rem; border-bottom: 1px solid var(--border-light);">
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
            <span style="background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">2</span>
            <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">Shipping Destination</h3>
          </div>
          <div class="form-group">
            <label class="form-label">Street Address</label>
            <input type="text" name="street" class="form-control" placeholder="100 Enterprise Way, Suite 400" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" placeholder="San Francisco" required>
            </div>
            <div class="form-group">
              <label class="form-label">State / Region</label>
              <input type="text" name="state" class="form-control" placeholder="CA" required maxlength="2">
            </div>
            <div class="form-group">
              <label class="form-label">ZIP / Postal</label>
              <input type="text" name="zip" class="form-control" placeholder="94105" required>
            </div>
          </div>
        </div>

        <!-- Step 3: Payment Method -->
        <div style="margin-bottom: 2rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
            <span style="background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">3</span>
            <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">Payment Gateway</h3>
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.85rem;">
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border: 2px solid var(--primary); border-radius: var(--radius); background: #f0f7ff; cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="STRIPE_CREDIT_CARD" checked style="accent-color: var(--primary); width: 18px; height: 18px;">
                <div>
                  <strong style="color: var(--text-main); font-size: 0.95rem;">Stripe Credit / Debit Card</strong>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Visa, MasterCard, Amex, Discover</div>
                </div>
              </div>
              <span class="badge badge-info">Instant Mock Capture</span>
            </label>

            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="PAYPAL" style="accent-color: var(--primary); width: 18px; height: 18px;">
                <div>
                  <strong style="color: var(--text-main); font-size: 0.95rem;">PayPal Express</strong>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Safe 1-click PayPal checkout</div>
                </div>
              </div>
              <span class="badge badge-secondary">PayPal Sandbox</span>
            </label>

            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY" style="accent-color: var(--primary); width: 18px; height: 18px;">
                <div>
                  <strong style="color: var(--text-main); font-size: 0.95rem;">Cash on Delivery (COD)</strong>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Pay upon shipment arrival</div>
                </div>
              </div>
              <span class="badge badge-warning">COD</span>
            </label>
          </div>
        </div>

        <button type="submit" id="submit-order-btn" class="btn btn-primary btn-lg" style="width: 100%; font-size: 1.15rem; padding: 1rem;">
          🔒 Authorize & Place Order Now
        </button>
      </form>

      <!-- Live Order Summary Card -->
      <div id="checkout-summary" style="background: var(--bg-surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); position: sticky; top: 90px;">
        <!-- Populated by checkout.js -->
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 OmniCommerce Enterprise Platform. All rights reserved.</p>
        <a href="/cart.html" style="color: #cbd5e1;">← Back to Cart</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthManager.init();
      if (user) {
        const nameInput = document.getElementById('cust-name');
        const emailInput = document.getElementById('cust-email');
        if (nameInput) nameInput.value = user.name || '';
        if (emailInput) emailInput.value = user.email || '';
      }
      await initCheckoutPage();
    });
  </script>
</body>
</html>
