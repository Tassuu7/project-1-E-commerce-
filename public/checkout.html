<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — EverydayStore</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div>
        <span>Secure 256-Bit Encrypted Checkout</span>
      </div>
      <div class="top-bar-links">
        <a href="/cart.html">← Back to Cart</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Everyday<span>Store</span></a>
      <ul class="nav-menu">
        <li><a href="/cart.html">← Back to Cart</a></li>
        <li>
          <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Theme">
            Dark Mode
          </button>
        </li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 3rem; margin-bottom: 5rem;">
    <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">Checkout</h1>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2.5rem;">Please review your shipping details and select a payment method</p>

    <div style="display: grid; grid-template-columns: 1.75fr 1fr; gap: 3rem; align-items: start;">
      <!-- Checkout Form -->
      <form id="checkout-form" onsubmit="submitOrder(event)" style="background: var(--bg-card); padding: 3rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--card-shadow);">
        <!-- Step 1: Customer Contact -->
        <div style="margin-bottom: 2.25rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-light);">
          <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 1.5rem;">1. Contact Information</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" id="cust-name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" id="cust-email" class="form-control" placeholder="john@example.com" required>
            </div>
          </div>
        </div>

        <!-- Step 2: Shipping Address -->
        <div style="margin-bottom: 2.25rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-light);">
          <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 1.5rem;">2. Shipping Address</h3>
          <div class="form-group">
            <label class="form-label">Street Address</label>
            <input type="text" name="street" class="form-control" placeholder="123 Market St, Apt 4" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" placeholder="Seattle" required>
            </div>
            <div class="form-group">
              <label class="form-label">State</label>
              <input type="text" name="state" class="form-control" placeholder="WA" required maxlength="2">
            </div>
            <div class="form-group">
              <label class="form-label">ZIP Code</label>
              <input type="text" name="zip" class="form-control" placeholder="98101" required>
            </div>
          </div>
        </div>

        <!-- Step 3: Payment -->
        <div style="margin-bottom: 2.5rem;">
          <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 1.5rem;">3. Payment Method</h3>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border: 2px solid #111827; border-radius: var(--radius); background: var(--bg-muted); cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <input type="radio" name="paymentMethod" value="STRIPE_CREDIT_CARD" checked style="width: 18px; height: 18px; accent-color: #111827;">
                <div>
                  <strong style="color: var(--text-main); font-size: 1.05rem;">Credit / Debit Card</strong>
                  <div style="font-size: 0.85rem; color: var(--text-muted);">Visa, MasterCard, American Express</div>
                </div>
              </div>
              <span class="badge badge-secondary">Direct Card</span>
            </label>

            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <input type="radio" name="paymentMethod" value="PAYPAL" style="width: 18px; height: 18px; accent-color: #111827;">
                <div>
                  <strong style="color: var(--text-main); font-size: 1.05rem;">PayPal</strong>
                  <div style="font-size: 0.85rem; color: var(--text-muted);">Fast checkout with your PayPal account</div>
                </div>
              </div>
              <span class="badge badge-secondary">PayPal</span>
            </label>

            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY" style="width: 18px; height: 18px; accent-color: #111827;">
                <div>
                  <strong style="color: var(--text-main); font-size: 1.05rem;">Cash on Delivery</strong>
                  <div style="font-size: 0.85rem; color: var(--text-muted);">Pay cash when package is delivered</div>
                </div>
              </div>
              <span class="badge badge-secondary">COD</span>
            </label>
          </div>
        </div>

        <button type="submit" id="submit-order-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          Place Order Now
        </button>
      </form>

      <!-- Live Order Summary Card -->
      <div id="checkout-summary" style="background: var(--bg-card); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--card-shadow); position: sticky; top: 95px;">
        <!-- Populated by checkout.js -->
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 EverydayStore. All rights reserved.</p>
        <a href="/cart.html" style="color: var(--text-muted);">← Back to Cart</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthManager.init();
      if (user) {
        const nameInput = document.getElementById('cust-name');
        const emailInput = document.getElementById('cust-email');
        if (nameInput) nameInput.value = user.name || '';
        if (emailInput) emailInput.value = user.email || '';
      }
      await initCheckoutPage();
    });
  </script>
</body>
</html>
