<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — EverydayStore</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div>
        <span>🔒 Secure SSL 256-Bit Encrypted Checkout</span>
      </div>
      <div class="top-bar-links">
        <a href="/cart.html">← Back to Cart</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Everyday<span>Store</span></a>
      <ul class="nav-menu">
        <li><a href="/cart.html">← Back to Cart</a></li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 2.5rem; margin-bottom: 5rem;">
    <h1 style="font-size: 2rem; font-weight: 800; color: #111827; margin-bottom: 0.5rem;">Checkout</h1>
    <p style="color: #6b7280; font-size: 1rem; margin-bottom: 2rem;">Enter your shipping address and choose payment</p>

    <div style="display: grid; grid-template-columns: 1.7fr 1fr; gap: 2.5rem; align-items: start;">
      <!-- Checkout Form -->
      <form id="checkout-form" onsubmit="submitOrder(event)" style="background: #ffffff; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
        <!-- Step 1: Customer Contact -->
        <div style="margin-bottom: 2rem; padding-bottom: 1.75rem; border-bottom: 1px solid var(--border-light);">
          <h3 style="font-size: 1.15rem; font-weight: 700; color: #111827; margin-bottom: 1.25rem;">1. Contact Information</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" id="cust-name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" id="cust-email" class="form-control" placeholder="john@example.com" required>
            </div>
          </div>
        </div>

        <!-- Step 2: Shipping Address -->
        <div style="margin-bottom: 2rem; padding-bottom: 1.75rem; border-bottom: 1px solid var(--border-light);">
          <h3 style="font-size: 1.15rem; font-weight: 700; color: #111827; margin-bottom: 1.25rem;">2. Shipping Address</h3>
          <div class="form-group">
            <label class="form-label">Street Address</label>
            <input type="text" name="street" class="form-control" placeholder="123 Market St, Apt 4" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" placeholder="Seattle" required>
            </div>
            <div class="form-group">
              <label class="form-label">State</label>
              <input type="text" name="state" class="form-control" placeholder="WA" required maxlength="2">
            </div>
            <div class="form-group">
              <label class="form-label">ZIP</label>
              <input type="text" name="zip" class="form-control" placeholder="98101" required>
            </div>
          </div>
        </div>

        <!-- Step 3: Payment -->
        <div style="margin-bottom: 2rem;">
          <h3 style="font-size: 1.15rem; font-weight: 700; color: #111827; margin-bottom: 1.25rem;">3. Payment Method</h3>
          <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border: 2px solid #111827; border-radius: var(--radius); background: #f9fafb; cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="STRIPE_CREDIT_CARD" checked style="width: 18px; height: 18px; accent-color: #111827;">
                <div>
                  <strong>Credit / Debit Card</strong>
                  <div style="font-size: 0.8rem; color: #6b7280;">Visa, MasterCard, Amex</div>
                </div>
              </div>
              <span class="badge badge-secondary">Card</span>
            </label>

            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="PAYPAL" style="width: 18px; height: 18px; accent-color: #111827;">
                <div>
                  <strong>PayPal</strong>
                  <div style="font-size: 0.8rem; color: #6b7280;">Pay with PayPal account</div>
                </div>
              </div>
              <span class="badge badge-secondary">PayPal</span>
            </label>

            <label style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; cursor: pointer;">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY" style="width: 18px; height: 18px; accent-color: #111827;">
                <div>
                  <strong>Cash on Delivery</strong>
                  <div style="font-size: 0.8rem; color: #6b7280;">Pay when your order arrives</div>
                </div>
              </div>
              <span class="badge badge-secondary">COD</span>
            </label>
          </div>
        </div>

        <button type="submit" id="submit-order-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          Place Order Now
        </button>
      </form>

      <!-- Live Order Summary Card -->
      <div id="checkout-summary" style="background: #ffffff; padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); position: sticky; top: 90px;">
        <!-- Populated by checkout.js -->
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 EverydayStore. All rights reserved.</p>
        <a href="/cart.html" style="color: #6b7280;">← Back to Cart</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthManager.init();
      if (user) {
        const nameInput = document.getElementById('cust-name');
        const emailInput = document.getElementById('cust-email');
        if (nameInput) nameInput.value = user.name || '';
        if (emailInput) emailInput.value = user.email || '';
      }
      await initCheckoutPage();
    });
  </script>
</body>
</html>
