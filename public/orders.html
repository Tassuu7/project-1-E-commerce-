<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders & Tracking — EverydayStore</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div>
        <span>Real-time shipment tracking with verified dispatch updates</span>
      </div>
      <div class="top-bar-links">
        <a href="/index.html">← Back to Shop</a>
        <a href="/cart.html">View Cart</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Everyday<span>Store</span></a>
      <ul class="nav-menu">
        <li><a href="/index.html">Shop</a></li>
        <li>
          <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Theme">
            Dark Mode
          </button>
        </li>
        <li>
          <a href="/cart.html" class="cart-btn">
            <span>Cart</span>
            <span id="cart-badge-count" class="cart-count" style="display: none;">0</span>
          </a>
        </li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 3rem; margin-bottom: 5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.25rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main);">My Orders & Tracking</h1>
        <p style="color: var(--text-muted); font-size: 1rem;">Track your delivery status and view order details</p>
      </div>
      <a href="/index.html" class="btn btn-primary">+ Browse More Items</a>
    </div>

    <div id="orders-list-container">
      <div style="text-align: center; padding: 5rem; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border);">
        <p style="color: var(--text-muted); font-size: 1.05rem;">Loading orders...</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 EverydayStore. All rights reserved.</p>
        <a href="/index.html" style="color: var(--text-muted);">← Back to Shop</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthManager.init();
      await CartManager.fetchCart();

      const params = new URLSearchParams(window.location.search);
      const singleOrderId = params.get('orderId');
      const container = document.getElementById('orders-list-container');

      if (singleOrderId) {
        try {
          const res = await APIClient.get(`/orders/${singleOrderId}`);
          if (res.success && res.data) {
            renderSingleOrder(res.data, container);
            return;
          }
        } catch (err) {
          console.warn('Single order not found, loading full list.');
        }
      }

      try {
        const res = await APIClient.get('/orders/user');
        if (res.success && res.data && res.data.length > 0) {
          renderOrdersList(res.data, container);
        } else {
          container.innerHTML = `
            <div style="background: var(--bg-card); padding: 5rem 2rem; text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--border);">
              <h3 style="font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">No orders found</h3>
              <p style="color: var(--text-muted); margin-bottom: 2rem;">You haven't placed any orders yet.</p>
              <a href="/index.html" class="btn btn-primary btn-lg">Start Shopping</a>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `<p style="color: var(--sale-red); text-align: center; padding: 2rem;">Error loading orders: ${err.message}</p>`;
      }
    });

    function getBadgeClass(status) {
      if (status === 'DELIVERED' || status === 'PAID') return 'badge-success';
      if (status === 'SHIPPED' || status === 'PROCESSING') return 'badge-info';
      if (status === 'PENDING') return 'badge-warning';
      return 'badge-danger';
    }

    function renderSingleOrder(order, container) {
      container.innerHTML = `
        <div style="background: var(--bg-card); padding: 3rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--card-shadow); max-width: 850px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 1.75rem; margin-bottom: 1.75rem;">
            <div>
              <span class="badge ${getBadgeClass(order.orderStatus)}" style="margin-bottom: 0.6rem;">${order.orderStatus}</span>
              <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">${order.orderNumber}</h2>
              <small style="color: var(--text-muted);">Ordered on ${new Date(order.createdAt).toLocaleDateString()}</small>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 0.9rem; color: var(--text-muted);">Total Amount</span>
              <div style="font-size: 2rem; font-weight: 900; color: var(--text-main);">$${order.grandTotal.toFixed(2)}</div>
            </div>
          </div>

          <!-- Items List -->
          <div style="margin-bottom: 2.25rem;">
            <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--text-main);">Purchased Items (${order.items.length})</h3>
            <div style="display: flex; flex-direction: column; gap: 0.85rem;">
              ${order.items.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: var(--bg-muted); border-radius: var(--radius-sm); border: 1px solid var(--border);">
                  <div style="display: flex; align-items: center; gap: 1rem;">
                    <img src="${item.image || '/images/placeholder.svg'}" alt="${item.name}" style="width: 52px; height: 52px; object-fit: contain; background: #fff; padding: 2px; border-radius: var(--radius-sm);" onerror="this.onerror=null; this.src='/images/placeholder.svg';">
                    <div>
                      <strong style="color: var(--text-main); font-size: 1rem;">${item.name}</strong>
                      <div style="font-size: 0.85rem; color: var(--text-muted);">Qty: ${item.quantity} × $${item.price.toFixed(2)}</div>
                    </div>
                  </div>
                  <strong style="font-size: 1.05rem; color: var(--text-main);">$${(item.price * item.quantity).toFixed(2)}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Tracking Details -->
          <div style="background: var(--bg-muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.75rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong style="color: var(--text-main); font-size: 0.9rem;">Shipment Tracking Number:</strong>
                <div style="font-size: 1.2rem; font-weight: 800; color: var(--text-main); font-family: monospace; margin-top: 0.25rem;">
                  ${order.trackingNumber || 'PENDING'}
                </div>
              </div>
              <span class="badge badge-info">Standard Courier</span>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/orders.html" class="btn btn-secondary btn-sm">← View All Orders</a>
            <button class="btn btn-primary btn-sm" onclick="window.print()">Print Receipt</button>
          </div>
        </div>
      `;
    }

    function renderOrdersList(orders, container) {
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
          ${orders.map(order => `
            <div style="background: var(--bg-card); padding: 1.75rem 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--card-shadow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem;">
                  <strong style="font-size: 1.2rem; color: var(--text-main);">${order.orderNumber}</strong>
                  <span class="badge ${getBadgeClass(order.orderStatus)}">${order.orderStatus}</span>
                </div>
                <div style="font-size: 0.9rem; color: var(--text-muted);">
                  Customer: <strong>${order.customerName}</strong> • Date: ${new Date(order.createdAt).toLocaleDateString()}
                </div>
                <div style="font-size: 0.85rem; color: var(--text-light); margin-top: 0.25rem;">
                  Tracking ID: <code style="background: var(--bg-muted); padding: 2px 6px; border-radius: 4px;">${order.trackingNumber || 'PENDING'}</code>
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 1.75rem;">
                <div style="text-align: right;">
                  <span style="font-size: 0.85rem; color: var(--text-muted);">Total</span>
                  <div style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">$${order.grandTotal.toFixed(2)}</div>
                </div>
                <a href="/orders.html?orderId=${order.id}" class="btn btn-secondary btn-sm">View Order Details →</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
  </script>
</body>
</html>
