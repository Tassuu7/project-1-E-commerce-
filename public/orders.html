<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders & Tracking — EverydayStore</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div>
        <span>📦 Live shipment tracking with real-time updates</span>
      </div>
      <div class="top-bar-links">
        <a href="/index.html">← Back to Shop</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Everyday<span>Store</span></a>
      <ul class="nav-menu">
        <li><a href="/index.html">Shop</a></li>
        <li>
          <a href="/cart.html" class="cart-btn">
            <span>Cart</span>
            <span id="cart-badge-count" class="cart-count" style="display: none;">0</span>
          </a>
        </li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 2.5rem; margin-bottom: 5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; color: #111827;">My Orders & Tracking</h1>
        <p style="color: #6b7280; font-size: 0.95rem;">Track your package and view past receipts</p>
      </div>
      <a href="/index.html" class="btn btn-primary">+ Shop More Items</a>
    </div>

    <div id="orders-list-container">
      <div style="text-align: center; padding: 5rem; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border);">
        <p style="color: #6b7280;">Loading orders...</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 EverydayStore. All rights reserved.</p>
        <a href="/index.html" style="color: #6b7280;">← Back to Shop</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthManager.init();
      await CartManager.fetchCart();

      const params = new URLSearchParams(window.location.search);
      const singleOrderId = params.get('orderId');
      const container = document.getElementById('orders-list-container');

      if (singleOrderId) {
        try {
          const res = await APIClient.get(`/orders/${singleOrderId}`);
          if (res.success && res.data) {
            renderSingleOrder(res.data, container);
            return;
          }
        } catch (err) {
          console.warn('Single order not found, loading full list.');
        }
      }

      try {
        const res = await APIClient.get('/orders/admin', { limit: 25 });
        if (res.success && res.data && res.data.length > 0) {
          renderOrdersList(res.data, container);
        } else {
          container.innerHTML = `
            <div style="background: #ffffff; padding: 5rem 2rem; text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--border);">
              <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
              <h3 style="font-size: 1.35rem; font-weight: 700; color: #111827; margin-bottom: 0.5rem;">No orders yet</h3>
              <p style="color: #6b7280; margin-bottom: 1.75rem;">You have not placed any orders yet.</p>
              <a href="/index.html" class="btn btn-primary">Start Shopping</a>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444; text-align: center;">Error loading orders: ${err.message}</p>`;
      }
    });

    function getBadgeClass(status) {
      if (status === 'DELIVERED' || status === 'PAID') return 'badge-success';
      if (status === 'SHIPPED' || status === 'PROCESSING') return 'badge-info';
      if (status === 'PENDING') return 'badge-warning';
      return 'badge-danger';
    }

    function renderSingleOrder(order, container) {
      container.innerHTML = `
        <div style="background: #ffffff; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); max-width: 800px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
            <div>
              <span class="badge ${getBadgeClass(order.orderStatus)}" style="margin-bottom: 0.5rem;">${order.orderStatus}</span>
              <h2 style="font-size: 1.5rem; font-weight: 800; color: #111827;">${order.orderNumber}</h2>
              <small style="color: #6b7280;">Ordered on ${new Date(order.createdAt).toLocaleDateString()}</small>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 0.85rem; color: #6b7280;">Total</span>
              <div style="font-size: 1.75rem; font-weight: 800; color: #111827;">$${order.grandTotal.toFixed(2)}</div>
            </div>
          </div>

          <!-- Items List -->
          <div style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: #111827;">Items (${order.items.length})</h3>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
              ${order.items.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #f9fafb; border-radius: var(--radius-sm); border: 1px solid var(--border);">
                  <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <img src="${item.image || '/images/placeholder.svg'}" alt="${item.name}" style="width: 48px; height: 48px; object-fit: cover; border-radius: var(--radius-sm);" onerror="this.onerror=null; this.src='/images/placeholder.svg';">
                    <div>
                      <strong style="color: #111827; font-size: 0.95rem;">${item.name}</strong>
                      <div style="font-size: 0.8rem; color: #6b7280;">Qty: ${item.quantity} × $${item.price.toFixed(2)}</div>
                    </div>
                  </div>
                  <strong>$${(item.price * item.quantity).toFixed(2)}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Tracking -->
          <div style="background: #f3f4f6; border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong style="color: #111827; font-size: 0.9rem;">Tracking ID:</strong>
                <div style="font-size: 1.15rem; font-weight: 700; color: #111827; font-family: monospace;">
                  ${order.trackingNumber || 'PENDING'}
                </div>
              </div>
              <span class="badge badge-info">Standard Courier</span>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/orders.html" class="btn btn-secondary btn-sm">← View All Orders</a>
            <button class="btn btn-dark btn-sm" onclick="window.print()">Print Receipt</button>
          </div>
        </div>
      `;
    }

    function renderOrdersList(orders, container) {
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          ${orders.map(order => `
            <div style="background: #ffffff; padding: 1.5rem 1.75rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.25rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.35rem;">
                  <strong style="font-size: 1.15rem; color: #111827;">${order.orderNumber}</strong>
                  <span class="badge ${getBadgeClass(order.orderStatus)}">${order.orderStatus}</span>
                </div>
                <div style="font-size: 0.875rem; color: #6b7280;">
                  Recipient: <strong>${order.customerName}</strong> • Date: ${new Date(order.createdAt).toLocaleDateString()}
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 1.5rem;">
                <div style="text-align: right;">
                  <span style="font-size: 0.8rem; color: #6b7280;">Total</span>
                  <div style="font-size: 1.35rem; font-weight: 800; color: #111827;">$${order.grandTotal.toFixed(2)}</div>
                </div>
                <a href="/orders.html?orderId=${order.id}" class="btn btn-secondary btn-sm">View Details →</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
  </script>
</body>
</html>
