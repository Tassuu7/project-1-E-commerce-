<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Orders - OmniCommerce</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Omni<span>Commerce</span></a>
      <ul class="nav-links">
        <li><a href="/index.html">Shop</a></li>
        <li><a href="/cart.html">Cart <span id="cart-badge-count" class="cart-badge">0</span></a></li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 2rem; margin-bottom: 3rem;">
    <h1>Customer Orders & Status Tracker</h1>
    <div id="orders-list-container" style="margin-top: 1.5rem;">
      <div style="text-align: center; padding: 2rem;">Loading orders...</div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 OmniCommerce Enterprise Platform.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthManager.init();
      await CartManager.fetchCart();

      const params = new URLSearchParams(window.location.search);
      const singleOrderId = params.get('orderId');

      const container = document.getElementById('orders-list-container');

      if (singleOrderId) {
        try {
          const res = await APIClient.get(`/orders/${singleOrderId}`);
          if (res.success) {
            renderSingleOrder(res.data, container);
            return;
          }
        } catch (err) {
          console.error(err);
        }
      }

      if (user) {
        try {
          const res = await APIClient.get('/orders/user');
          if (res.success && res.data.length > 0) {
            renderOrdersList(res.data, container);
          } else {
            container.innerHTML = '<div style="background: #fff; padding: 2rem; border-radius: var(--radius); text-align: center;">No past orders found.</div>';
          }
        } catch (err) {
          container.innerHTML = `<div style="color: var(--danger-color);">Error loading orders: ${err.message}</div>`;
        }
      } else {
        container.innerHTML = '<div style="background: #fff; padding: 2rem; border-radius: var(--radius); text-align: center;">Please log in to view your order history.</div>';
      }
    });

    function renderSingleOrder(order, container) {
      container.innerHTML = `
        <div style="background: #fff; padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border-color);">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
            <div>
              <h2>Order ${order.orderNumber}</h2>
              <small style="color: var(--text-muted);">Placed on ${new Date(order.createdAt).toLocaleString()}</small>
            </div>
            <div>
              <span class="badge badge-info">${order.orderStatus}</span>
            </div>
          </div>
          <div style="margin: 1.5rem 0;">
            <h3>Items</h3>
            <ul style="list-style: none; margin-top: 0.5rem;">
              ${order.items.map(item => `
                <li style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px dashed var(--border-color);">
                  <span>${item.name} x ${item.quantity}</span>
                  <strong>$${(item.price * item.quantity).toFixed(2)}</strong>
                </li>
              `).join('')}
            </ul>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin-top: 1rem;">
            <span>Grand Total:</span>
            <span style="color: var(--primary-color);">$${order.grandTotal.toFixed(2)}</span>
          </div>
          ${order.trackingNumber ? `
            <div style="margin-top: 1.5rem; background: #f8fafc; padding: 1rem; border-radius: var(--radius);">
              <strong>Tracking Number:</strong> ${order.trackingNumber}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderOrdersList(orders, container) {
      container.innerHTML = orders.map(order => `
        <div style="background: #fff; padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border-color); margin-bottom: 1rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong>${order.orderNumber}</strong> - ${new Date(order.createdAt).toLocaleDateString()}
              <div>Total: <strong>$${order.grandTotal.toFixed(2)}</strong> (${order.items.length} items)</div>
            </div>
            <div>
              <span class="badge badge-info">${order.orderStatus}</span>
              <a href="/orders.html?orderId=${order.id}" class="btn btn-secondary btn-sm" style="margin-left: 0.5rem;">View Details</a>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
