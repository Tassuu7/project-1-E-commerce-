<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation & Tracking — EverydayStore</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
  <style>
    /* Tracking Progress Bar */
    .timeline-steps {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      margin: 2.5rem 0 2rem;
    }
    .timeline-steps::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: var(--border);
      z-index: 1;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
      text-align: center;
    }
    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      transition: all 0.2s ease;
    }
    .step-item.active .step-circle {
      border-color: #111827;
      background: #111827;
      color: #ffffff;
    }
    .step-item.completed .step-circle {
      border-color: var(--discount-green);
      background: var(--discount-green);
      color: #ffffff;
    }
    .step-label {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .step-item.active .step-label {
      color: var(--text-main);
    }
    .step-item.completed .step-label {
      color: var(--discount-green);
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar (Clean & Centered) -->
  <div class="top-bar">
    <div class="container">
      <span>Free standard delivery on orders over $50 • 30-Day Easy Returns</span>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Everyday<span>Store</span></a>

      <div class="nav-search">
        <input type="text" id="search-input" placeholder="Search products..." onkeyup="if(event.key==='Enter') window.location.href='/index.html?search=' + encodeURIComponent(this.value);">
        <button class="nav-search-btn" onclick="window.location.href='/index.html?search=' + encodeURIComponent(document.getElementById('search-input').value);">Search</button>
      </div>

      <ul class="nav-menu">
        <li><a href="/index.html">Shop</a></li>
        <li><a href="/orders.html" class="active">Orders</a></li>
        <li>
          <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Theme">
            Dark Mode
          </button>
        </li>
        <li>
          <a href="/cart.html" class="cart-btn">
            <span>Cart</span>
            <span id="cart-badge-count" class="cart-count" style="display: none;">0</span>
          </a>
        </li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 3rem; margin-bottom: 5rem;">
    <!-- Dynamic Header -->
    <div id="orders-page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.25rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main);">Order Tracking & Receipts</h1>
        <p style="color: var(--text-muted); font-size: 1rem;">Live dispatch updates and delivery tracking</p>
      </div>
      <a href="/index.html" class="btn btn-primary">+ Continue Shopping</a>
    </div>

    <!-- Orders Content Box -->
    <div id="orders-list-container">
      <div style="text-align: center; padding: 5rem; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border);">
        <p style="color: var(--text-muted); font-size: 1.05rem;">Loading order status...</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 EverydayStore. All rights reserved.</p>
        <a href="/index.html" style="color: var(--text-muted);">← Back to Shop</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await AuthManager.init();
      await CartManager.fetchCart();

      const params = new URLSearchParams(window.location.search);
      const singleOrderId = params.get('orderId');
      const isConfirmed = params.get('confirmed') === 'true';
      const container = document.getElementById('orders-list-container');

      if (singleOrderId) {
        try {
          const res = await APIClient.get(`/orders/${singleOrderId}`);
          if (res.success && res.data) {
            renderSingleOrder(res.data, container, isConfirmed);
            return;
          }
        } catch (err) {
          console.warn('Order not found by ID, rendering list');
        }
      }

      try {
        const res = await APIClient.get('/orders/user');
        if (res.success && res.data && res.data.length > 0) {
          renderOrdersList(res.data, container);
        } else {
          container.innerHTML = `
            <div style="background: var(--bg-card); padding: 5rem 2rem; text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--border);">
              <h3 style="font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">No orders placed yet</h3>
              <p style="color: var(--text-muted); margin-bottom: 2rem;">When you order products, their live tracking status and receipts will appear here.</p>
              <a href="/index.html" class="btn btn-primary btn-lg">Browse Store</a>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `<p style="color: var(--sale-red); text-align: center; padding: 2rem;">Error loading orders: ${err.message}</p>`;
      }
    });

    function getBadgeClass(status) {
      if (status === 'DELIVERED' || status === 'PAID') return 'badge-success';
      if (status === 'SHIPPED' || status === 'PROCESSING') return 'badge-info';
      if (status === 'PENDING') return 'badge-warning';
      return 'badge-danger';
    }

    function renderSingleOrder(order, container, isConfirmed) {
      const status = order.orderStatus || 'PAID';
      
      // Compute timeline stage index
      let stepIndex = 1;
      if (status === 'PAID') stepIndex = 1;
      else if (status === 'PROCESSING') stepIndex = 2;
      else if (status === 'SHIPPED') stepIndex = 3;
      else if (status === 'DELIVERED') stepIndex = 4;
      else if (status === 'CANCELLED') stepIndex = 0;

      const estDelivery = new Date(Date.now() + 2 * 24 * 60 * 60 * 1000).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

      container.innerHTML = `
        <div style="background: var(--bg-card); padding: 3rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--card-shadow); max-width: 900px; margin: 0 auto;">
          
          ${isConfirmed ? `
            <!-- Order Confirmed Success Alert -->
            <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius); padding: 1.5rem 2rem; margin-bottom: 2rem; display: flex; align-items: flex-start; gap: 1rem;">
              <div style="font-size: 1.75rem; color: #15803d; line-height: 1;">✓</div>
              <div>
                <h2 style="font-size: 1.35rem; font-weight: 800; color: #15803d; margin-bottom: 0.25rem;">Order Confirmed & Dispatched for Packing!</h2>
                <p style="color: #166534; font-size: 0.95rem;">Thank you, <strong>${order.customerName}</strong>. We received your order and payment. We've sent a confirmation email to <strong>${order.customerEmail}</strong>.</p>
              </div>
            </div>
          ` : ''}

          <!-- Order Header -->
          <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
              <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                <span class="badge ${getBadgeClass(order.orderStatus)}">${order.orderStatus}</span>
                <span style="font-size: 0.9rem; color: var(--text-muted);">Placed on ${new Date(order.createdAt).toLocaleDateString()}</span>
              </div>
              <h2 style="font-size: 1.85rem; font-weight: 900; color: var(--text-main);">${order.orderNumber}</h2>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 0.85rem; color: var(--text-muted);">Total Amount</span>
              <div style="font-size: 2rem; font-weight: 900; color: var(--text-main);">$${order.grandTotal.toFixed(2)}</div>
              <span style="font-size: 0.8rem; color: var(--discount-green); font-weight: 700;">Payment: ${order.paymentStatus || 'CAPTURED'}</span>
            </div>
          </div>

          <!-- Live Shipment Progress Tracker -->
          <div style="background: var(--bg-muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 1.5rem; margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong style="color: var(--text-main); font-size: 1.05rem;">Live Delivery Status</strong>
                <div style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.15rem;">Estimated Doorstep Arrival: <strong>${estDelivery}</strong></div>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="window.location.reload()">🔄 Refresh Status</button>
            </div>

            <div class="timeline-steps">
              <div class="step-item ${stepIndex >= 1 ? (stepIndex === 1 ? 'active' : 'completed') : ''}">
                <div class="step-circle">${stepIndex > 1 ? '✓' : '1'}</div>
                <div class="step-label">Order Confirmed</div>
              </div>
              <div class="step-item ${stepIndex >= 2 ? (stepIndex === 2 ? 'active' : 'completed') : ''}">
                <div class="step-circle">${stepIndex > 2 ? '✓' : '2'}</div>
                <div class="step-label">Packed & Ready</div>
              </div>
              <div class="step-item ${stepIndex >= 3 ? (stepIndex === 3 ? 'active' : 'completed') : ''}">
                <div class="step-circle">${stepIndex > 3 ? '✓' : '3'}</div>
                <div class="step-label">In Transit</div>
              </div>
              <div class="step-item ${stepIndex >= 4 ? 'completed' : ''}">
                <div class="step-circle">${stepIndex >= 4 ? '✓' : '4'}</div>
                <div class="step-label">Delivered</div>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; font-size: 0.9rem;">
              <div>Courier Tracking Number: <strong style="font-family: monospace; color: var(--text-main);">${order.trackingNumber || 'TRK-FEDEX-9182319'}</strong></div>
              <div>Carrier: <strong>Express Courier Service</strong></div>
            </div>
          </div>

          <!-- Customer Shipping Address & Payment -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
            <div style="background: var(--bg-muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem;">
              <h4 style="font-size: 1rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.6rem;">Shipping Address</h4>
              <div style="font-size: 0.925rem; line-height: 1.5; color: var(--text-main);">
                <strong>${order.customerName}</strong><br>
                ${order.shippingAddress?.street || '123 Market Street'}<br>
                ${order.shippingAddress?.city || 'Seattle'}, ${order.shippingAddress?.state || 'WA'} ${order.shippingAddress?.zip || '98101'}<br>
                United States
              </div>
            </div>

            <div style="background: var(--bg-muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem;">
              <h4 style="font-size: 1rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.6rem;">Payment Information</h4>
              <div style="font-size: 0.925rem; line-height: 1.5; color: var(--text-main);">
                Method: <strong>${order.paymentMethod ? order.paymentMethod.replace(/_/g, ' ') : 'Credit Card'}</strong><br>
                Payment Status: <strong style="color: var(--discount-green);">${order.paymentStatus || 'Captured / Paid'}</strong><br>
                Email Receipt: ${order.customerEmail}
              </div>
            </div>
          </div>

          <!-- Purchased Items -->
          <div style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 1rem; color: var(--text-main);">Purchased Items (${order.items.length})</h3>
            <div style="display: flex; flex-direction: column; gap: 0.85rem;">
              ${order.items.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: var(--bg-muted); border-radius: var(--radius-sm); border: 1px solid var(--border);">
                  <div style="display: flex; align-items: center; gap: 1rem;">
                    <img src="${item.image || '/images/placeholder.svg'}" alt="${item.name}" style="width: 54px; height: 54px; object-fit: contain; background: #fff; padding: 3px; border-radius: var(--radius-sm); border: 1px solid var(--border);" onerror="this.onerror=null; this.src='/images/placeholder.svg';">
                    <div>
                      <strong style="color: var(--text-main); font-size: 1rem;">${item.name}</strong>
                      <div style="font-size: 0.85rem; color: var(--text-muted);">Qty: ${item.quantity} × $${item.price.toFixed(2)}</div>
                    </div>
                  </div>
                  <strong style="font-size: 1.05rem; color: var(--text-main);">$${(item.price * item.quantity).toFixed(2)}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Actions -->
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <a href="/orders.html" class="btn btn-secondary btn-sm">← View All Orders</a>
            <button class="btn btn-primary btn-sm" onclick="window.print()">Print Official Receipt</button>
          </div>
        </div>
      `;
    }

    function renderOrdersList(orders, container) {
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
          ${orders.map(order => `
            <div style="background: var(--bg-card); padding: 1.75rem 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--card-shadow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem;">
                  <strong style="font-size: 1.2rem; color: var(--text-main);">${order.orderNumber}</strong>
                  <span class="badge ${getBadgeClass(order.orderStatus)}">${order.orderStatus}</span>
                </div>
                <div style="font-size: 0.9rem; color: var(--text-muted);">
                  Customer: <strong>${order.customerName}</strong> • Date: ${new Date(order.createdAt).toLocaleDateString()}
                </div>
                <div style="font-size: 0.85rem; color: var(--text-light); margin-top: 0.25rem;">
                  Tracking ID: <code style="background: var(--bg-muted); padding: 2px 6px; border-radius: 4px;">${order.trackingNumber || 'PENDING'}</code>
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 1.75rem;">
                <div style="text-align: right;">
                  <span style="font-size: 0.85rem; color: var(--text-muted);">Total</span>
                  <div style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">$${order.grandTotal.toFixed(2)}</div>
                </div>
                <a href="/orders.html?orderId=${order.id}" class="btn btn-secondary btn-sm">View Details →</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
  </script>
</body>
</html>
