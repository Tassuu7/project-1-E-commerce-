<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Orders & Shipment Tracker - OmniCommerce Enterprise</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Omni<span>Commerce</span> <span class="logo-badge">Enterprise</span></a>
      <ul class="nav-links">
        <li><a href="/index.html">Shop Catalog</a></li>
        <li><a href="/cart.html" class="cart-link">🛒 Cart <span id="cart-badge-count" class="cart-badge" style="display: none;">0</span></a></li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 2.5rem; margin-bottom: 4rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main);">Customer Orders & Tracking</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Real-time fulfillment and shipment status for your enterprise purchases</p>
      </div>
      <a href="/index.html" class="btn btn-primary btn-sm">+ Shop More Products</a>
    </div>

    <div id="orders-list-container">
      <div style="text-align: center; padding: 4rem; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border);">
        <strong>Loading your orders...</strong>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 OmniCommerce Enterprise Platform. All rights reserved.</p>
        <a href="/index.html" style="color: #cbd5e1;">← Return to Storefront</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthManager.init();
      await CartManager.fetchCart();

      const params = new URLSearchParams(window.location.search);
      const singleOrderId = params.get('orderId');
      const container = document.getElementById('orders-list-container');

      if (singleOrderId) {
        try {
          const res = await APIClient.get(`/orders/${singleOrderId}`);
          if (res.success && res.data) {
            renderSingleOrder(res.data, container);
            return;
          }
        } catch (err) {
          console.warn('Single order not found, falling back to full list.');
        }
      }

      try {
        const res = await APIClient.get('/orders/admin', { limit: 20 });
        if (res.success && res.data && res.data.length > 0) {
          renderOrdersList(res.data, container);
        } else {
          container.innerHTML = `
            <div style="background: var(--bg-surface); padding: 5rem 2rem; text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--border);">
              <div style="font-size: 3rem; margin-bottom: 1rem;">📦</div>
              <h3 style="font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">No orders placed yet</h3>
              <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Place your first order through our streamlined checkout wizard.</p>
              <a href="/index.html" class="btn btn-primary">Explore Products</a>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `<div style="color: var(--danger); text-align: center; padding: 3rem;">Error loading orders: ${err.message}</div>`;
      }
    });

    function getBadgeClass(status) {
      if (status === 'DELIVERED' || status === 'PAID') return 'badge-success';
      if (status === 'SHIPPED' || status === 'PROCESSING') return 'badge-info';
      if (status === 'PENDING') return 'badge-warning';
      return 'badge-danger';
    }

    function renderSingleOrder(order, container) {
      container.innerHTML = `
        <div style="background: var(--bg-surface); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); max-width: 800px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
            <div>
              <span class="badge ${getBadgeClass(order.orderStatus)}" style="margin-bottom: 0.5rem;">${order.orderStatus}</span>
              <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">${order.orderNumber}</h2>
              <small style="color: var(--text-muted);">Placed on ${new Date(order.createdAt).toLocaleString()}</small>
            </div>
            <div style="text-align: right;">
              <span style="font-size: 0.85rem; color: var(--text-muted);">Total Amount</span>
              <div style="font-size: 1.75rem; font-weight: 800; color: var(--primary);">$${order.grandTotal.toFixed(2)}</div>
            </div>
          </div>

          <!-- Items List -->
          <div style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main);">Ordered Items (${order.items.length})</h3>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
              ${order.items.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1rem; background: #f8fafc; border-radius: var(--radius); border: 1px solid var(--border);">
                  <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <img src="${item.image || '/images/placeholder.svg'}" alt="${item.name}" style="width: 45px; height: 45px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border);" onerror="this.onerror=null; this.src='/images/placeholder.svg';">
                    <div>
                      <strong style="color: var(--text-main); font-size: 0.95rem;">${item.name}</strong>
                      <div style="font-size: 0.8rem; color: var(--text-muted);">Qty: ${item.quantity} × $${item.price.toFixed(2)}</div>
                    </div>
                  </div>
                  <strong style="color: var(--text-main);">$${(item.price * item.quantity).toFixed(2)}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Shipping & Tracking Details -->
          <div style="background: #f0f7ff; border: 1px solid #bfdbfe; border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong style="color: #1e3a8a; font-size: 0.95rem;">Tracking Number:</strong>
                <div style="font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-top: 0.25rem;">
                  ${order.trackingNumber || 'PENDING_LABEL'}
                </div>
                <small style="color: var(--text-muted);">Carrier: FedEx Express Priority Ground</small>
              </div>
              <button class="btn btn-primary btn-sm" onclick="showToast('Tracking coordinates synchronized with courier API', 'info')">Track Live</button>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border);">
            <a href="/orders.html" class="btn btn-secondary btn-sm">← View All Orders</a>
            <button class="btn btn-dark btn-sm" onclick="window.print()">Print Invoice</button>
          </div>
        </div>
      `;
    }

    function renderOrdersList(orders, container) {
      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
          ${orders.map(order => `
            <div style="background: var(--bg-surface); padding: 1.75rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem;">
                  <strong style="font-size: 1.15rem; color: var(--text-main);">${order.orderNumber}</strong>
                  <span class="badge ${getBadgeClass(order.orderStatus)}">${order.orderStatus}</span>
                </div>
                <div style="font-size: 0.875rem; color: var(--text-muted);">
                  Customer: <strong>${order.customerName}</strong> (${order.customerEmail}) • Placed: ${new Date(order.createdAt).toLocaleDateString()}
                </div>
                <div style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem;">
                  Tracking: <code>${order.trackingNumber || 'N/A'}</code>
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 1.5rem;">
                <div style="text-align: right;">
                  <span style="font-size: 0.8rem; color: var(--text-muted);">Total</span>
                  <div style="font-size: 1.4rem; font-weight: 800; color: var(--primary);">$${order.grandTotal.toFixed(2)}</div>
                </div>
                <a href="/orders.html?orderId=${order.id}" class="btn btn-secondary btn-sm">View Details →</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
  </script>
</body>
</html>
