<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - OmniCommerce</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Omni<span>Commerce</span></a>
      <ul class="nav-links">
        <li><a href="/index.html">Shop</a></li>
        <li><a href="/cart.html">Cart <span id="cart-badge-count" class="cart-badge">0</span></a></li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 2rem; margin-bottom: 3rem;">
    <div id="product-detail-container">
      <div style="text-align: center; padding: 3rem;">Loading product details...</div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 OmniCommerce Enterprise Platform.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await AuthManager.init();
      await CartManager.fetchCart();

      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');

      if (!productId) {
        window.location.href = '/index.html';
        return;
      }

      try {
        const res = await APIClient.get(`/products/${productId}`);
        const reviewsRes = await APIClient.get(`/reviews/${productId}`);

        if (res.success) {
          const p = res.data;
          const reviews = reviewsRes.data || [];

          document.getElementById('product-detail-container').innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; background: #fff; padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border-color);">
              <div>
                <img src="${p.images[0] || 'https://via.placeholder.com/500'}" alt="${p.name}" style="width: 100%; border-radius: var(--radius); object-fit: cover; max-height: 400px;">
              </div>
              <div>
                <span class="badge badge-info">${p.category}</span>
                <h1 style="margin: 0.5rem 0 1rem 0;">${p.name}</h1>
                <p style="color: var(--text-muted); margin-bottom: 1rem;">SKU: ${p.sku}</p>
                <div style="font-size: 2rem; font-weight: 700; color: var(--primary-color); margin-bottom: 1rem;">
                  $${p.effectivePrice.toFixed(2)}
                </div>
                <p style="margin-bottom: 1.5rem; line-height: 1.6;">${p.description || 'High-quality enterprise product engineered for durability and top performance.'}</p>
                <div style="margin-bottom: 1.5rem;">
                  <strong>Stock Status:</strong>
                  <span class="badge badge-${p.stock > 0 ? 'success' : 'danger'}">${p.stock > 0 ? `In Stock (${p.stock} units)` : 'Out of Stock'}</span>
                </div>
                <button class="btn btn-primary" onclick="CartManager.addItem('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}>Add to Shopping Cart</button>
              </div>
            </div>

            <div style="margin-top: 3rem; background: #fff; padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border-color);">
              <h2>Customer Reviews (${reviews.length})</h2>
              ${reviews.length === 0 ? '<p style="color: var(--text-muted); margin-top: 1rem;">No reviews yet for this product.</p>' : `
                <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                  ${reviews.map(r => `
                    <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                      <div style="display: flex; justify-content: space-between;">
                        <strong>${r.userName}</strong>
                        <span style="color: var(--accent-color);">★ ${r.rating}/5</span>
                      </div>
                      <p style="margin-top: 0.5rem;">${r.comment}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          `;
        }
      } catch (err) {
        document.getElementById('product-detail-container').innerHTML = `<div style="color: var(--danger-color); text-align: center;">Error loading product: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
