<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — EverydayStore</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div>
        <span>⚡ Free standard shipping on orders over $50</span>
      </div>
      <div class="top-bar-links">
        <a href="/orders.html">Track My Order</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">Everyday<span>Store</span></a>
      <ul class="nav-menu">
        <li><a href="/index.html">← Continue Shopping</a></li>
        <li>
          <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Theme">
            🌙 Dark Mode
          </button>
        </li>
        <li>
          <a href="/cart.html" class="cart-btn">
            <span>Cart</span>
            <span id="cart-badge-count" class="cart-count" style="display: none;">0</span>
          </a>
        </li>
        <li id="nav-auth-container"></li>
      </ul>
    </div>
  </header>

  <main class="container" style="margin-top: 3rem; margin-bottom: 5rem;">
    <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 2rem;">Shopping Cart</h1>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 3rem; align-items: start;">
      <!-- Cart Items Table Section -->
      <div id="cart-items-container">
        <div style="text-align: center; padding: 5rem; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border);">
          <p style="color: var(--text-muted); font-size: 1.1rem;">Loading cart items...</p>
        </div>
      </div>

      <!-- Order Summary Card -->
      <div id="cart-summary-card" style="background: var(--bg-card); padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--card-shadow); position: sticky; top: 95px;">
        <h3 style="font-size: 1.35rem; font-weight: 800; color: var(--text-main); margin-bottom: 1.75rem;">Order Summary</h3>

        <!-- Coupon Apply Input -->
        <div style="margin-bottom: 1.75rem;">
          <label class="form-label" style="font-size: 0.9rem;">Promo Discount Code</label>
          <div style="display: flex; gap: 0.6rem;">
            <input type="text" id="coupon-code-input" class="form-control" placeholder="e.g. WELCOME10" style="text-transform: uppercase;">
            <button class="btn btn-secondary" onclick="applyPromo()">Apply</button>
          </div>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap;">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Quick apply:</span>
            <span class="badge badge-secondary" style="cursor: pointer;" onclick="document.getElementById('coupon-code-input').value='WELCOME10'; applyPromo();">WELCOME10 (10% off)</span>
            <span class="badge badge-secondary" style="cursor: pointer;" onclick="document.getElementById('coupon-code-input').value='SUMMER20'; applyPromo();">SUMMER20 ($20 off)</span>
          </div>
        </div>

        <div id="summary-details">
          <!-- Populated by JS -->
        </div>

        <a href="/checkout.html" id="checkout-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1.75rem; text-decoration: none; text-align: center;">
          Proceed to Checkout →
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 EverydayStore. All rights reserved.</p>
        <a href="/index.html" style="color: var(--text-muted);">← Back to Shop</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await AuthManager.init();
      await renderCartPage();
    });

    async function renderCartPage() {
      const cart = await CartManager.fetchCart();
      const itemsContainer = document.getElementById('cart-items-container');
      const summaryDetails = document.getElementById('summary-details');
      const checkoutBtn = document.getElementById('checkout-btn');

      if (!cart || !cart.items || cart.items.length === 0) {
        itemsContainer.innerHTML = `
          <div style="background: var(--bg-card); padding: 5rem 2rem; text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--border);">
            <div style="font-size: 3.5rem; margin-bottom: 1.25rem;">🛒</div>
            <h3 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">Your cart is empty</h3>
            <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">Looks like you haven't added any items yet.</p>
            <a href="/index.html" class="btn btn-primary btn-lg">Start Shopping</a>
          </div>
        `;
        summaryDetails.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 1rem 0;">No items</p>';
        if (checkoutBtn) checkoutBtn.style.display = 'none';
        return;
      }

      if (checkoutBtn) checkoutBtn.style.display = 'block';

      itemsContainer.innerHTML = `
        <div style="background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--card-shadow);">
          <table class="data-table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th style="text-align: right;">Remove</th>
              </tr>
            </thead>
            <tbody>
              ${cart.items.map(item => `
                <tr>
                  <td>
                    <div style="display: flex; align-items: center; gap: 1.25rem;">
                      <img src="${item.image || '/images/placeholder.svg'}" alt="${item.name}" style="width: 70px; height: 70px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border);" onerror="this.onerror=null; this.src='/images/placeholder.svg';">
                      <div>
                        <strong style="color: var(--text-main); font-size: 1.05rem;">${item.name}</strong>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.15rem;">SKU: ${item.sku || 'N/A'}</div>
                      </div>
                    </div>
                  </td>
                  <td><strong style="color: var(--text-main);">$${item.price.toFixed(2)}</strong></td>
                  <td>
                    <div style="display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-card);">
                      <button style="padding: 0.45rem 0.85rem; background: transparent; border: none; cursor: pointer; color: var(--text-main); font-size: 1.05rem;" onclick="updateQty('${item.productId}', ${item.quantity - 1})">-</button>
                      <span style="padding: 0.45rem 0.85rem; font-weight: 800; font-size: 0.95rem; color: var(--text-main);">${item.quantity}</span>
                      <button style="padding: 0.45rem 0.85rem; background: transparent; border: none; cursor: pointer; color: var(--text-main); font-size: 1.05rem;" onclick="updateQty('${item.productId}', ${item.quantity + 1})">+</button>
                    </div>
                  </td>
                  <td><strong style="font-size: 1.1rem; color: var(--text-main);">$${(item.price * item.quantity).toFixed(2)}</strong></td>
                  <td style="text-align: right;">
                    <button class="btn btn-secondary btn-sm" onclick="removeItem('${item.productId}')" title="Remove item">✕</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      summaryDetails.innerHTML = `
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.85rem; font-size: 0.975rem;">
          <span style="color: var(--text-muted);">Subtotal (${cart.itemCount} items):</span> 
          <strong style="color: var(--text-main);">$${cart.subtotal.toFixed(2)}</strong>
        </div>
        ${cart.discountAmount > 0 ? `
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.85rem; font-size: 0.975rem; color: var(--success);">
          <span>Discount (${cart.appliedCoupon?.code || 'ACTIVE'}):</span> 
          <strong>-$${cart.discountAmount.toFixed(2)}</strong>
        </div>` : ''}
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.85rem; font-size: 0.975rem;">
          <span style="color: var(--text-muted);">Estimated Tax:</span> 
          <strong style="color: var(--text-main);">$${cart.taxAmount.toFixed(2)}</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 1.25rem; font-size: 0.975rem;">
          <span style="color: var(--text-muted);">Shipping:</span> 
          <strong>${cart.shippingAmount === 0 ? '<span style="color: var(--success);">FREE</span>' : `$${cart.shippingAmount.toFixed(2)}`}</strong>
        </div>
        <div style="padding-top: 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 1.15rem; font-weight: 800; color: var(--text-main);">Total:</span>
          <span style="font-size: 1.85rem; font-weight: 900; color: var(--text-main);">$${cart.grandTotal.toFixed(2)}</span>
        </div>
      `;
    }

    async function updateQty(productId, qty) {
      if (qty <= 0) {
        return removeItem(productId);
      }
      await CartManager.updateQuantity(productId, qty);
      renderCartPage();
    }

    async function removeItem(productId) {
      await CartManager.updateQuantity(productId, 0);
      renderCartPage();
    }

    async function applyPromo() {
      const input = document.getElementById('coupon-code-input');
      const code = input ? input.value.trim() : '';
      if (!code) return;
      try {
        await CartManager.applyCoupon(code);
        renderCartPage();
      } catch (err) {
        // Handled in cart.js
      }
    }
  </script>
</body>
</html>
